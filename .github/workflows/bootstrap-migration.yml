name: bootstrap-migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hwpx-pages-bootstrap
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reconstruct validated repository tree
        shell: bash
        run: |
          set -euo pipefail
          cp .bootstrap/payload.tar.xz /tmp/hwpx-pages.tar.xz
          echo "162bbee443ac2198c07c38f996ca4ce6ecef5f1bae15e1b1fc03783e9d21617d  /tmp/hwpx-pages.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xJf /tmp/hwpx-pages.tar.xz -C .
          rm -rf .bootstrap

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum fonts-baekmuk
          fc-cache -f

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Verify release gate
        run: |
          npm run build
          python scripts/release_gate.py

      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate validated v41 release tree and regression suite"
          git push
