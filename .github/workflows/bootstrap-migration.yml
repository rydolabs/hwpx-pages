name: bootstrap-migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hwpx-pages-bootstrap
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    container: python:3.13-trixie
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct validated repository tree
        shell: bash
        run: |
          set -euo pipefail
          cp .bootstrap/payload.tar.xz /tmp/hwpx-pages.tar.xz
          echo "09b2e24a214511cd7feff8aed193ba89851518d792ba773a240e173b0567b05b  /tmp/hwpx-pages.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xJf /tmp/hwpx-pages.tar.xz -C .
          rm -rf .bootstrap

      - name: Install deterministic system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             chromium fonts-nanum fonts-baekmuk poppler-utils nodejs npm fontconfig git
          fc-cache -f
          chromium --version
          python --version
          node --version

      - name: Install Python test dependencies
        run: python -m pip install --no-cache-dir -r requirements-dev.txt

      - name: Verify release gate
        run: |
          npm run build
          python scripts/release_gate.py

      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate validated v41 release tree and regression suite"
          git push
